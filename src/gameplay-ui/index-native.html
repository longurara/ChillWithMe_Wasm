<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f1c22">
  <title>Chill with You · Lo-Fi Story</title>
  <link rel="icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="ui/native.css">
</head>
<body>
  <div id="unity-container"><canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Phòng của Satone"></canvas></div>
  <div id="unity-loading-bar"><canvas id="startup-canvas" aria-hidden="true"></canvas><span id="startup-status" class="sr-only" role="status">Đang tải game…</span></div>
  <div id="unity-warning" role="alert" hidden></div>
  <script src="ui/startup.js"></script>
  <script src="Build/WebPlayer.loader.js"></script>
  <script>
    document.addEventListener('gesturestart',event=>event.preventDefault(),{passive:false});
    document.addEventListener('gesturechange',event=>event.preventDefault(),{passive:false});
    const warning=document.getElementById('unity-warning');
    if(!window.ChillStartup)window.ChillStartup={progress(){},fail(message){warning.hidden=false;warning.textContent=message;const retry=document.createElement('button');retry.textContent='Retry';retry.onclick=()=>location.reload();warning.appendChild(retry);},finish(){return Promise.reject(new Error('Không tải được màn hình khởi động.'));}};
    function showWarning(message,type) {
      warning.hidden=false;warning.textContent=message;
      if(type==='error'){window.ChillStartup.fail(message);return;}
      setTimeout(()=>{warning.hidden=true;},5000);
    }
    Promise.resolve().then(()=>createUnityInstance(document.getElementById('unity-canvas'),{
      dataUrl:'Build/WebPlayer.data',frameworkUrl:'Build/WebPlayer.framework.js',codeUrl:'Build/WebPlayer.wasm',streamingAssetsUrl:'StreamingAssets',
      companyName:'HLC',productName:'Chill with You Web',productVersion:'1.23.0',devicePixelRatio:Math.min(window.devicePixelRatio||1,matchMedia('(pointer: coarse)').matches?1.5:2),showBanner:showWarning
    },progress=>window.ChillStartup.progress(progress))).then(instance=>{
      window.chillUnityInstance=instance;
      document.addEventListener('visibilitychange',()=>instance.SendMessage('ChillPrototype','BrowserVisibility',document.hidden?'hidden':'visible'));
      window.addEventListener('pagehide',()=>instance.SendMessage('ChillPrototype','SaveFromBrowser'));
    }).catch(error=>{showWarning('Không mở được game. '+error,'error');});
  </script>
</body>
</html>
